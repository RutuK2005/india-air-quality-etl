[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "india-air-quality-etl"
version = "0.1.0"
description = "Incremental ETL pipeline: Open-Meteo weather + air quality for Indian cities into a DuckDB warehouse."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rutuparn Kulkarni" }]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "duckdb>=1.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
spark = ["pyspark>=3.5"]

[project.scripts]
etl = "aq_etl.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# typer's documented pattern uses function calls in argument defaults
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
